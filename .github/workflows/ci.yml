# Tomatick CI — DEV-STANDARDS §15.
#
# Every GUI dependency in go.mod (fyne.io/fyne/v2, fyne.io/systray,
# golang.design/x/hotkey) binds a native toolkit through cgo, so there is no
# cross-compilation: each OS is built on its own runner.
#
# Action SHAs are pinned per §15 — a tag is mutable, a SHA is not. Re-resolve with:
#   gh api repos/actions/checkout/git/refs/tags/v7.0.1 --jq .object.sha

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # MEASURED: run 33950120958 — windows-latest 8m28s (choco mingw + a cold cgo
    # build), ubuntu 3m21s, macos 1m23s. 25 is ~3x the worst observed; past it a
    # job is wedged rather than slow.
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"

      # xorg-dev covers the X11 backend; libwayland-dev covers the Wayland one.
      # BOTH are required: go-gl/glfw's build tags are
      # `(linux && !x11 && !wayland) || (linux && wayland)` on c_glfw_lin_wayland.go,
      # so with no tags set the Wayland backend compiles too and wl_platform.h
      # needs <wayland-client-core.h>. Without libwayland-dev this step "succeeds"
      # and the BUILD fails — run 33950120958, ubuntu-latest:
      #   wl_platform.h:27:10: fatal error: wayland-client-core.h: No such file
      # The vendored glfw ships pre-generated *-client-protocol.h, so
      # wayland-protocols/wayland-scanner are NOT needed, and libdecor is
      # dlopen'd at runtime rather than included, so libdecor-0-dev is not either.
      - name: Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev

      - name: Windows gcc
        if: runner.os == 'Windows'
        run: choco install mingw -y

      - name: Logic tests
        run: go test ./internal/sessions ./internal/alarms ./internal/history ./internal/settings ./internal/core

      - name: Build
        run: go build -o tomatick ./cmd/tomatick
        env:
          CGO_ENABLED: "1"

  # templates/ruleset-main.json requires the status-check context "ci" (§4). A
  # matrix job cannot produce that context — it produces one per entry, e.g.
  # "Test (ubuntu-latest)" — so applying the standard ruleset to this repo without
  # this job would block every merge forever on a check that can never report.
  # `if: always()` matters: without it a failed matrix leaves this SKIPPED, and a
  # skipped required check does not block.
  ci:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Gate on the build matrix
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "matrix result: $RESULT"
          test "$RESULT" = "success"
