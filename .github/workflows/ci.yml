name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Windows gcc
        if: runner.os == 'Windows'
        run: choco install mingw -y

      - name: Logic tests
        run: go test ./internal/sessions ./internal/alarms ./internal/history ./internal/settings ./internal/core

      - name: Build
        run: go build -o tomatick ./cmd/tomatick
        env:
          CGO_ENABLED: "1"
